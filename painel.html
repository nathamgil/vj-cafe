<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel VJ · pedidos, caixa, estoque e clientes</title>
<link rel="icon" href="img/logo-96.webp" type="image/webp">
<meta name="theme-color" content="#3d2718"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--cafe:#3d2718;--cafe2:#5c3d27;--ouro:#a8803f;--creme:#faf5ec;--papel:#f3eadb;--tinta:#1f150f;--cinza:#5f5247;--linha:#e3d5bd;--ok:#2f6b3a;--al:#b3261e;--ifood:#c8102e;--site:#2c5d8f}
*{box-sizing:border-box;margin:0}
body{font-family:Jost,system-ui,sans-serif;background:#fbf8f2;color:var(--tinta);font-size:16px}
button{font:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--cafe);color:#f3eadb;padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.lg{display:flex;gap:10px;align-items:center;margin-bottom:18px}
.lg img{width:42px;height:42px;border-radius:50%}
.lg b{font-family:'Cormorant Garamond';font-size:20px;color:#fff;line-height:1.1}
.nv{display:flex;align-items:center;gap:10px;background:none;border:0;color:#f3eadb;padding:11px 12px;border-radius:10px;text-align:left;font-size:16px}
.nv.on{background:#f3eadb;color:var(--cafe);font-weight:600}
.nv svg{width:20px;height:20px;flex:none}
.nv .bd{margin-left:auto;background:var(--al);color:#fff;border-radius:999px;font-size:12px;padding:1px 7px}
aside .pe{margin-top:auto;font-size:13px;opacity:.8}
aside .pe a{color:#e8c98e}
main{padding:24px 28px 80px;min-width:0}
h1{font-family:'Cormorant Garamond';font-size:36px;color:var(--cafe)}
.sub{color:var(--cinza);margin:2px 0 20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.k{background:#fff;border:1px solid var(--linha);border-radius:14px;padding:16px}
.k small{color:var(--cinza);font-size:14px}
.k b{display:block;font-size:28px;color:var(--cafe);margin-top:4px}
.k i{font-style:normal;font-size:13px;color:var(--cinza)}
.box{background:#fff;border:1px solid var(--linha);border-radius:14px;padding:18px;margin-bottom:18px}
.box h2{font-size:18px;color:var(--cafe);margin-bottom:12px}
.b{white-space:nowrap;border:1px solid var(--cafe);background:#fff;color:var(--cafe);border-radius:6px;font-weight:500;padding:9px 14px;font-weight:600}
.b.p{background:var(--cafe);color:#fff}
.b.r{border-color:var(--al);color:var(--al)}
.b.sm{padding:6px 10px;font-size:14px}
.ch{border:1px solid var(--linha);background:#fff;border-radius:6px;padding:7px 14px;color:var(--tinta)}
.ch.on{background:var(--cafe);border-color:var(--cafe);color:#fff}
.tag{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;color:#fff}
.t-site{background:var(--site)}.t-ifood{background:var(--ifood)}.t-balcao{background:var(--cafe2)}.t-whatsapp{background:var(--ok)}
.kb{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:14px;overflow-x:auto}
.col{background:var(--papel);border-radius:14px;padding:12px;min-height:200px}
.col h3{font-size:15px;color:var(--cafe);margin-bottom:10px;display:flex;justify-content:space-between}
.pd{background:#fff;border:1px solid var(--linha);border-radius:12px;padding:12px;margin-bottom:10px;font-size:14px}
.pd.nv2{animation:pis 1s 3;border-color:var(--ouro)}
@keyframes pis{50%{box-shadow:0 0 0 4px rgba(168,128,63,.4)}}
.pd .t{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.pd .t b{font-size:16px}
.pd ul{padding-left:16px;margin:6px 0;color:var(--cinza)}
.pd .ac{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;color:var(--cinza);font-weight:500;font-size:13px;border-bottom:1px solid var(--linha);padding:8px 6px}
td{border-bottom:1px solid #f0e6d6;padding:10px 6px;vertical-align:middle}
.al{color:var(--al);font-weight:600}
.bar{height:8px;border-radius:9px;background:#efe4d1;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--ok)}
.bar i.lo{background:var(--al)}
.pdv{display:grid;grid-template-columns:1fr 340px;gap:18px}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.prods button{background:#fff;border:1.5px solid var(--linha);border-radius:12px;padding:12px;text-align:left;min-height:84px;color:var(--tinta)}
.prods button:hover{border-color:var(--cafe)}
.prods b{display:block;color:var(--cafe);margin-top:6px}
.tk{background:#fff;border:1.5px solid var(--cafe);border-radius:14px;padding:16px;position:sticky;top:20px;align-self:start}
.tk .l{display:flex;justify-content:space-between;padding:4px 0}
.tk .g{font-size:22px;font-weight:700;color:var(--cafe);border-top:1px solid var(--linha);margin-top:8px;padding-top:8px}
.pays{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
input,select{padding:9px 10px;border:1.5px solid var(--linha);border-radius:9px;font:inherit;background:#fff;color:var(--tinta)}
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:10px}
.chart div{flex:1;background:var(--cafe2);border-radius:5px 5px 0 0;position:relative;min-width:8px}
.chart div span{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--cinza)}
.md{position:fixed;inset:0;background:rgba(31,21,15,.5);display:none;place-items:center;z-index:50;padding:16px}
.md.on{display:grid}
.md>div{background:#fff;border-radius:16px;padding:22px;width:min(520px,100%);max-height:90vh;overflow:auto}
.md h2{font-family:'Cormorant Garamond';font-size:28px;color:var(--cafe);margin-bottom:12px}
.fm{display:grid;gap:10px}
.fm label{font-size:14px;font-weight:600;color:var(--cinza)}
.toast{position:fixed;bottom:20px;right:20px;background:var(--tinta);color:#fff;padding:12px 18px;border-radius:12px;opacity:0;transition:.2s;z-index:60}
.toast.on{opacity:1}
.mob{display:none}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{position:fixed;bottom:0;top:auto;height:auto;width:100%;flex-direction:row;z-index:30;padding:6px;overflow-x:auto;gap:2px}.lg,aside .pe{display:none}.nv{flex-direction:column;font-size:11px;gap:2px;padding:6px 8px;flex:1;min-width:64px}.nv .bd{position:absolute;margin:0 0 0 22px}main{padding:16px 14px 90px}.kb{grid-template-columns:repeat(4,80vw)}.pdv{grid-template-columns:1fr}.tk{position:static}.hide-m{display:none}}
</style>
</head>
<body>
<div class="app">
<aside id="nav"></aside>
<main id="main"></main>
</div>
<div class="md" id="md" onclick="if(event.target===this)fm()"><div id="mdc"></div></div>
<div class="toast" id="toast"></div>
<script src="data.js"></script>
<script>
const $=s=>document.querySelector(s),brl=VJ.brl;let D=VJ.db(),V='hoje',F='todos',CQ='',CS='todos',TK={},TP='pix';const novos=new Set(),visto=new Set(D.pedidos.map(p=>p.id));
const I={hoje:'<path d="M3 12l9-8 9 8M5 10v10h14V10"/>',pedidos:'<path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 7h6M9 11h6"/>',caixa:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M7 7V4h10v3M3 12h18"/>',estoque:'<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>',clientes:'<circle cx="9" cy="8" r="4"/><path d="M1 21c0-4 4-6 8-6s8 2 8 6M17 4a4 4 0 010 8M23 21c0-3-2-5-5-6"/>',cardapio:'<path d="M4 4h16v16H4zM8 9h8M8 13h8M8 17h5"/>'};
const N={hoje:'Hoje',pedidos:'Pedidos',caixa:'Caixa',estoque:'Estoque',clientes:'Clientes',cardapio:'Cardápio'};
const sod=t=>{const d=new Date(t);d.setHours(0,0,0,0);return+d},hoje=sod(Date.now()),dHoje=p=>sod(p.criado)===hoje;
const hm=i=>new Date(i).toTimeString().slice(0,5),dias=i=>i?Math.floor((hoje-sod(i))/864e5):999,sum=(a,f)=>a.reduce((s,x)=>s+(f(x)||0),0);
const tagC=c=>`<span class="tag t-${c}">${D.canais[c]}</span>`,tf=t=>{t=VJ.tel(t);return t.length>=10?`(${t.slice(0,2)}) ${t.slice(2,-4)}-${t.slice(-4)}`:t};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200)}
function fm(){$('#md').classList.remove('on')}
function modal(h){$('#mdc').innerHTML=h;$('#md').classList.add('on')}
function go(v){V=v;render();scrollTo(0,0)}
function nav(){const ab=D.pedidos.filter(p=>['novo'].includes(p.status)).length,bx=D.estoque.filter(e=>e.qtd<e.min).length;
 $('#nav').innerHTML=`<div class="lg"><img src="img/logo-96.webp" width="42" height="42" alt=""><b>VJ Café &<br>Pâtisserie</b></div>`+Object.keys(N).map(k=>`<button class="nv ${V===k?'on':''}" onclick="go('${k}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${I[k]}</svg>${N[k]}${k==='pedidos'&&ab?`<span class="bd">${ab}</span>`:''}${k==='estoque'&&bx?`<span class="bd">${bx}</span>`:''}</button>`).join('')+`<div class="pe">Demonstração Zync<br><a href="index.html" target="_blank">abrir o site</a> · <a href="#" onclick="confirma('Zerar a demonstração?','Pedidos, caixa e clientes voltam aos dados de exemplo.','Zerar',()=>{D=VJ.reset();render()});return false">zerar demo</a></div>`}
function render(){D=VJ.db();nav();$('#main').innerHTML=({hoje:vHoje,pedidos:vPed,caixa:vCaixa,estoque:vEst,clientes:vCli,cardapio:vCard})[V]()}

function vHoje(){
 const ph=D.pedidos.filter(p=>dHoje(p)&&p.status!=='cancelado'),fat=sum(ph,p=>p.total),por=c=>sum(ph.filter(p=>p.canal===c),p=>p.total);
 const ifoodTx=por('ifood')*D.config.taxaIfoodPct/100,mes=D.pedidos.filter(p=>dias(p.criado)<30&&p.status!=='cancelado');
 const econ=sum(mes.filter(p=>p.canal==='site'),p=>p.subtotal)*D.config.taxaIfoodPct/100;
 const d14=[...Array(14)].map((_,i)=>{const d=13-i;return{d,v:sum(D.pedidos.filter(p=>dias(p.criado)===d&&p.status!=='cancelado'),p=>p.total)}}),mx=Math.max(...d14.map(x=>x.v),1);
 const top={};mes.forEach(p=>p.itens.forEach(i=>top[i.nome]=(top[i.nome]||0)+i.qtd));
 const bx=D.estoque.filter(e=>e.qtd<e.min),sum30=D.clientes.filter(c=>dias(c.ultimo)>=15);
 return `<h1>${new Date().getHours()<12?'Bom dia':new Date().getHours()<18?'Boa tarde':'Boa noite'}, Jamile e Victor</h1><p class="sub">${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})} · tudo da VJ num lugar só</p>
 <div class="kp"><div class="k"><small>Vendido hoje</small><b>${brl(fat)}</b><i>${ph.length} pedidos · ticket ${brl(ph.length?fat/ph.length:0)}</i></div>
 <div class="k"><small>Por canal hoje</small><table style="margin-top:4px">${['balcao','site','ifood'].map(c=>`<tr><td style="padding:3px 0;border:0">${tagC(c)}</td><td style="padding:3px 0;border:0;text-align:right;font-weight:600">${brl(por(c))}</td></tr>`).join('')}</table></div>
 <div class="k"><small>Comissão iFood hoje (${D.config.taxaIfoodPct}%)</small><b class="al">− ${brl(ifoodTx)}</b><i>o que fica com o iFood</i></div>
 <div class="k"><small>Economia com pedidos do site (30 dias)</small><b style="color:var(--ok)">+ ${brl(econ)}</b><i>comissão que não foi paga</i></div></div>
 <div class="box"><h2>Vendas dos últimos 14 dias</h2><div class="chart">${d14.map(x=>`<div style="height:${Math.max(4,x.v/mx*100)}%" title="${brl(x.v)}"><span>${x.d?new Date(Date.now()-x.d*864e5).getDate():'hj'}</span></div>`).join('')}</div><div style="height:20px"></div></div>
 <div class="row" style="align-items:stretch">
 <div class="box" style="flex:1;min-width:260px"><h2>Mais vendidos (30 dias)</h2><table>${Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([n,q])=>`<tr><td>${n}</td><td style="text-align:right"><b>${q}</b></td></tr>`).join('')}</table></div>
 <div class="box" style="flex:1;min-width:260px"><h2>Atenção agora</h2><table>
 ${bx.map(e=>`<tr><td class="al">Estoque baixo</td><td>${e.nome}: ${e.qtd} ${e.un}</td></tr>`).join('')}
 <tr><td>Clientes sumidos</td><td>${sum30.length} não voltam há 15+ dias · <a href="#" onclick="CS='sumidos';go('clientes');return false">chamar</a></td></tr>
 <tr><td>Pedidos novos</td><td>${D.pedidos.filter(p=>p.status==='novo').length} aguardando · <a href="#" onclick="go('pedidos');return false">ver</a></td></tr></table></div></div>`}

function vPed(){
 const L=D.pedidos.filter(p=>(F==='todos'||p.canal===F)&&(['novo','preparo','pronto','saiu'].includes(p.status)||(dHoje(p)&&p.status==='concluido')));
 const col=(s,n)=>{const a=L.filter(p=>p.status===s);return `<div class="col"><h3>${n}<span>${a.length}</span></h3>${a.map(card).join('')||'<p style="color:var(--cinza);font-size:14px">vazio</p>'}</div>`};
 return `<h1>Pedidos</h1><p class="sub">Site, iFood, WhatsApp e balcão chegam na mesma tela. Pedido novo do site aparece aqui na hora.</p>
 <div class="row" style="margin-bottom:16px">${['todos','site','ifood','balcao','whatsapp'].map(c=>`<button class="ch ${F===c?'on':''}" onclick="F='${c}';render()">${c==='todos'?'Todos':D.canais[c]}</button>`).join('')}
 <span style="flex:1"></span><button class="b" onclick="lancaIfood()">+ Lançar pedido iFood</button><button class="b p" onclick="go('caixa')">+ Venda no balcão</button></div>
 <div class="kb">${col('novo','Novos')}${col('preparo','Em preparo')}${col('pronto','Prontos')}${col('saiu','Com o motoboy')}</div>
 <div class="box" style="margin-top:18px"><h2>Concluídos hoje</h2><table><tr><th>#</th><th>Canal</th><th>Cliente</th><th class="hide-m">Itens</th><th>Total</th><th>Hora</th></tr>${L.filter(p=>p.status==='concluido').map(p=>`<tr><td>${p.num}</td><td>${tagC(p.canal)}</td><td>${p.cliente.nome}</td><td class="hide-m">${p.itens.map(i=>i.qtd+'× '+i.nome).join(', ')}</td><td>${brl(p.total)}</td><td>${hm(p.criado)}</td></tr>`).join('')}</table></div>`}
function card(p){const prox={novo:['preparo','Aceitar e preparar'],preparo:['pronto','Marcar pronto'],pronto:p.tipo==='entrega'?['saiu','Entregar ao motoboy']:['concluido','Cliente retirou'],saiu:['concluido','Entregue']}[p.status];
 const min=Math.round((Date.now()-new Date(p.criado))/6e4);
 return `<div class="pd ${novos.has(p.id)?'nv2':''}"><div class="t"><b>#${p.num}</b>${tagC(p.canal)}</div><div><b>${p.cliente.nome}</b> · ${p.tipo==='entrega'?'Entrega':p.tipo==='retirada'?'Retirada':'Balcão'}</div>
 <ul>${p.itens.map(i=>`<li>${i.qtd}× ${i.nome}</li>`).join('')}</ul>${p.obs?`<div style="color:var(--al)">Obs: ${p.obs}</div>`:''}
 <div class="row" style="justify-content:space-between"><b>${brl(p.total)}</b><small style="color:${min>20&&p.status!=='saiu'?'var(--al)':'var(--cinza)'}">${min<60?min+' min':hm(p.criado)}</small></div>
 <div class="ac"><button class="b p sm" onclick="st('${p.id}','${prox[0]}')">${prox[1]}</button>${p.status==='pronto'&&p.tipo==='entrega'?`<button class="b sm" onclick="moto('${p.id}')">Chamar motoboy</button>`:''}${p.cliente.tel?`<a class="b sm" style="text-decoration:none" target="_blank" href="https://wa.me/55${p.cliente.tel}?text=${encodeURIComponent('Oi '+p.cliente.nome.split(' ')[0]+', aqui é da VJ Café! Seu pedido #'+p.num+' ')}">WhatsApp</a>`:''}<button class="b r sm" onclick="confirma('Cancelar o pedido #${p.num}?','O estoque baixado volta automaticamente.','Cancelar pedido',()=>st('${p.id}','cancelado'))">Cancelar</button></div></div>`}
function st(id,s){VJ.mudarStatus(id,s);novos.delete(id);toast(s==='preparo'?'Pedido aceito · estoque baixado automaticamente':s==='cancelado'?'Pedido cancelado · estoque devolvido':'Status atualizado');render()}
function moto(id){const p=D.pedidos.find(x=>x.id===id);modal(`<h2>Chamar motoboy</h2><p>Pedido #${p.num} · ${p.endereco||p.cliente.nome}</p><div class="fm" style="margin-top:12px"><button class="b p" onclick="VJ.mudarStatus('${id}','saiu');fm();toast('Motoboy solicitado no Entrega Fácil iFood · link de rastreio enviado ao cliente');render()">Solicitar via ${D.config.motoboyIfood}</button><button class="b" onclick="VJ.mudarStatus('${id}','saiu');fm();toast('Saiu com motoboy próprio');render()">Motoboy próprio / parceiro da região</button><p style="font-size:13px;color:var(--cinza)">Na versão final, a solicitação vai direto para a API de entregas e o cliente recebe o link de rastreio no WhatsApp.</p></div>`)}
function lancaIfood(){modal(`<h2>Lançar pedido iFood</h2><p style="color:var(--cinza);font-size:14px;margin-bottom:10px">Na versão final os pedidos do iFood entram sozinhos pela integração. Aqui dá para simular.</p><div class="fm"><label>Cliente</label><input id="ic" value="Cliente iFood"><label>Itens</label>${D.produtos.filter(p=>p.cat!=='Tortas inteiras').slice(0,10).map(p=>`<div class="row" style="justify-content:space-between"><span>${p.nome}</span><input type="number" min="0" value="0" data-id="${p.id}" style="width:70px"></div>`).join('')}<button class="b p" onclick="salvaIfood()">Lançar</button></div>`)}
function salvaIfood(){const it=[...document.querySelectorAll('[data-id]')].filter(i=>+i.value>0).map(i=>{const p=D.produtos.find(x=>x.id===i.dataset.id);return{id:p.id,nome:p.nome,preco:p.preco,qtd:+i.value}});if(!it.length){toast('Escolha ao menos um item');return}VJ.criarPedido({canal:'ifood',cliente:{nome:$('#ic').value},tipo:'entrega',pagamento:'ifood',itens:it});fm();toast('Pedido iFood lançado');render()}

function vCaixa(){
 const c=D.caixa,ab=+new Date(c.abertura),vs=D.pedidos.filter(p=>+new Date(p.criado)>=ab&&p.status!=='cancelado'&&p.canal!=='ifood');
 const fp=k=>sum(vs.filter(p=>p.pagamento===k),p=>p.total),mv=t=>sum(c.movs.filter(m=>m.tipo===t),m=>m.valor),din=c.fundo+fp('dinheiro')-mv('sangria')-mv('despesa');
 const tot=sum(Object.entries(TK),([id,q])=>D.produtos.find(p=>p.id===id).preco*q);
 if(!c.aberto)return `<h1>Caixa</h1><p class="sub">Caixa fechado.</p><div class="box"><div class="fm" style="max-width:300px"><label>Fundo de troco</label><input id="fu" value="150"><button class="b p" onclick="D.caixa={aberto:true,abertura:new Date().toISOString(),fundo:+$('#fu').value||0,movs:[]};VJ.save(D);render()">Abrir caixa</button></div></div>${hist()}`;
 return `<h1>Caixa</h1><p class="sub">Aberto às ${hm(c.abertura)} · venda de balcão em dois toques, e o fechamento bate sozinho.</p>
 <div class="kp"><div class="k"><small>Dinheiro na gaveta</small><b>${brl(din)}</b><i>fundo ${brl(c.fundo)} + vendas − saídas</i></div><div class="k"><small>Pix</small><b>${brl(fp('pix'))}</b></div><div class="k"><small>Cartão (créd. + déb.)</small><b>${brl(fp('credito')+fp('debito'))}</b></div><div class="k"><small>Saídas (sangria + despesa)</small><b class="al">${brl(mv('sangria')+mv('despesa'))}</b></div></div>
 <div class="pdv"><div><div class="box"><h2>Venda no balcão</h2><div class="prods">${D.produtos.map(p=>`<button onclick="TK['${p.id}']=(TK['${p.id}']||0)+1;render()">${p.nome}<b>${brl(p.preco)}</b></button>`).join('')}</div></div>
 <div class="box"><h2>Movimentos</h2><div class="row" style="margin-bottom:10px"><button class="b sm" onclick="movi('sangria')">Sangria</button><button class="b sm" onclick="movi('despesa')">Despesa</button><button class="b sm" onclick="movi('suprimento')">Suprimento</button><span style="flex:1"></span><button class="b p sm" onclick="fecha(${din})">Fechar caixa</button></div><table>${c.movs.map(m=>`<tr><td>${hm(m.t)}</td><td>${m.tipo}</td><td>${m.desc}</td><td>${brl(m.valor)}</td></tr>`).join('')||'<tr><td>sem movimentos</td></tr>'}</table></div></div>
 <div class="tk"><h2 style="font-family:'Cormorant Garamond';font-size:26px;color:var(--cafe)">Comanda</h2>${Object.entries(TK).map(([id,q])=>{const p=D.produtos.find(x=>x.id===id);return `<div class="l"><span>${q}× ${p.nome}</span><span>${brl(p.preco*q)} <a href="#" onclick="if(--TK['${id}']<=0)delete TK['${id}'];render();return false" style="color:var(--al)">×</a></span></div>`}).join('')||'<p style="color:var(--cinza)">Toque nos produtos para lançar.</p>'}
 <div class="l g"><span>Total</span><span>${brl(tot)}</span></div><div class="pays">${['pix','credito','debito','dinheiro'].map(k=>`<button class="ch ${TP===k?'on':''}" onclick="TP='${k}';render()">${{pix:'Pix',credito:'Crédito',debito:'Débito',dinheiro:'Dinheiro'}[k]}</button>`).join('')}</div>
 <input id="tc" placeholder="WhatsApp do cliente (opcional, alimenta o CRM)" style="width:100%;margin-bottom:8px"><button class="b p" style="width:100%" onclick="vende()" ${tot?'':'disabled'}>Finalizar venda</button></div></div>`}
function vende(){const tl=VJ.tel($('#tc').value),c=tl.length>=10?(D.clientes.find(x=>VJ.tel(x.tel)===tl)||{nome:'Cliente',tel:tl}):null;
 const p=VJ.criarPedido({canal:'balcao',cliente:c?{nome:c.nome,tel:tl}:null,tipo:'balcao',status:'concluido',pagamento:TP,itens:Object.entries(TK).map(([id,q])=>{const x=D.produtos.find(p=>p.id===id);return{id,nome:x.nome,preco:x.preco,qtd:q}})});TK={};toast('Venda #'+p.num+' registrada · estoque baixado');render()}
function movi(t){const T={sangria:'Sangria',despesa:'Despesa',suprimento:'Suprimento'}[t];modal(`<h2>${T}</h2><div class="fm"><label for="mv">Valor (R$)</label><input id="mv" inputmode="decimal" placeholder="0,00"><label for="md2">Descrição</label><input id="md2" placeholder="${t==='despesa'?'Ex.: gelo, guardanapos':t==='sangria'?'Ex.: depósito no banco':'Ex.: reforço de troco'}"><div class="row" style="justify-content:flex-end;margin-top:6px"><button class="b" onclick="fm()">Voltar</button><button class="b p" onclick="salvaMov('${t}')">Registrar</button></div></div>`);setTimeout(()=>$('#mv').focus(),30)}
function salvaMov(t){const v=num($('#mv').value);if(!v){$('#mv').style.borderColor='var(--al)';return}D.caixa.movs.unshift({t:new Date().toISOString(),tipo:t,valor:t==='suprimento'?-v:v,desc:$('#md2').value.trim()||t});VJ.save(D);fm();toast('Movimento registrado');render()}
const num=s=>+String(s).replace(/\./g,'').replace(',','.')||0;
function confirma(t,d,b,f){window._cf=f;modal(`<h2>${t}</h2><p style="color:var(--cinza)">${d}</p><div class="row" style="justify-content:flex-end;margin-top:18px"><button class="b" onclick="fm()">Voltar</button><button class="b p" style="background:var(--al);border-color:var(--al)" onclick="fm();window._cf()">${b}</button></div>`)}
function fecha(esp){modal(`<h2>Fechar caixa</h2><div class="fm"><p>Esperado em dinheiro: <b>${brl(esp)}</b></p><label>Contado na gaveta</label><input id="ct" inputmode="decimal" value="${esp.toFixed(2).replace('.',',')}"><button class="b p" onclick="const ct=num($('#ct').value);D.fechamentos.unshift({t:new Date().toISOString(),esperado:${esp},contado:ct});D.caixa.aberto=false;VJ.save(D);fm();toast('Caixa fechado · diferença '+brl(ct-${esp}));render()">Confirmar fechamento</button></div>`)}
function hist(){return `<div class="box"><h2>Fechamentos</h2><table>${D.fechamentos.map(f=>`<tr><td>${new Date(f.t).toLocaleString('pt-BR')}</td><td>esperado ${brl(f.esperado)}</td><td>contado ${brl(f.contado)}</td><td class="${Math.abs(f.contado-f.esperado)>0.5?'al':''}">dif. ${brl(f.contado-f.esperado)}</td></tr>`).join('')||'<tr><td>nenhum ainda</td></tr>'}</table></div>`}

function vEst(){const v=sum(D.estoque,e=>e.qtd*e.custo);
 return `<h1>Estoque</h1><p class="sub">Cada venda baixa os insumos pela ficha técnica do produto (ex.: cappuccino = 9 g de café + 120 ml de leite + 1 copo). Alerta quando passa do mínimo.</p>
 <div class="kp"><div class="k"><small>Valor em estoque</small><b>${brl(v)}</b></div><div class="k"><small>Itens abaixo do mínimo</small><b class="al">${D.estoque.filter(e=>e.qtd<e.min).length}</b></div></div>
 <div class="box"><table><tr><th>Insumo</th><th>Quantidade</th><th class="hide-m">Nível</th><th class="hide-m">Mínimo</th><th></th></tr>${D.estoque.map(e=>{const r=Math.min(1,e.qtd/(e.min*2));return `<tr><td>${e.nome}</td><td class="${e.qtd<e.min?'al':''}">${Math.round(e.qtd)} ${e.un}</td><td class="hide-m"><div class="bar"><i class="${e.qtd<e.min?'lo':''}" style="width:${r*100}%"></i></div></td><td class="hide-m">${e.min} ${e.un}</td><td><button class="b sm" onclick="ent('${e.id}')">+ Entrada</button></td></tr>`}).join('')}</table></div>
 <div class="box"><h2>Últimas movimentações</h2><table>${D.movEstoque.slice(0,8).map(m=>`<tr><td>${new Date(m.t).toLocaleString('pt-BR')}</td><td>${m.tipo}</td><td>${m.ref}</td></tr>`).join('')||'<tr><td>As baixas automáticas aparecem aqui assim que um pedido entra em preparo.</td></tr>'}</table></div>`}
function ent(id){const e=D.estoque.find(x=>x.id===id);modal(`<h2>Entrada de estoque</h2><p style="color:var(--cinza);margin-bottom:12px">${e.nome} · hoje: ${Math.round(e.qtd)} ${e.un}</p><div class="fm"><label for="eq">Quantidade recebida (${e.un})</label><input id="eq" inputmode="decimal"><label for="ec">Custo unitário (R$)</label><input id="ec" inputmode="decimal" value="${String(e.custo).replace('.',',')}"><div class="row" style="justify-content:flex-end;margin-top:6px"><button class="b" onclick="fm()">Voltar</button><button class="b p" onclick="salvaEnt('${id}')">Registrar entrada</button></div></div>`);setTimeout(()=>$('#eq').focus(),30)}
function salvaEnt(id){const e=D.estoque.find(x=>x.id===id),q=num($('#eq').value);if(!q){$('#eq').style.borderColor='var(--al)';return}e.qtd+=q;e.custo=num($('#ec').value)||e.custo;D.movEstoque.unshift({t:new Date().toISOString(),tipo:'entrada',ref:e.nome+' +'+q+' '+e.un});VJ.save(D);fm();toast('Entrada registrada');render()}

function vCli(){
 const seg={todos:()=>1,vip:c=>c.tags.includes('vip')||c.gasto>=300,empresa:c=>c.tags.includes('empresa'),sumidos:c=>dias(c.ultimo)>=15,novos:c=>c.pedidos<=1,aniver:c=>c.aniversario&&+c.aniversario.split('/')[1]===new Date().getMonth()+1||c.aniversario&&+c.aniversario.split('/')[1]===new Date().getMonth()+2};
 const L=D.clientes.filter(seg[CS]).filter(c=>!CQ||(c.nome+c.tel).toLowerCase().includes(CQ.toLowerCase())).sort((a,b)=>b.gasto-a.gasto);
 const msg=c=>CS==='sumidos'?`Oi ${c.nome.split(' ')[0]}! Sentimos sua falta na VJ. Essa semana sua fatia de torta favorita sai com 15% off. Te esperamos na Escariz!`:CS==='aniver'?`Oi ${c.nome.split(' ')[0]}! Seu aniversário está chegando. Que tal encomendar sua torta na VJ? Quem faz aniversário ganha um café.`:`Oi ${c.nome.split(' ')[0]}! Aqui é da VJ Café & Pâtisserie.`;
 return `<h1>Clientes</h1><p class="sub">Todo pedido do site, do balcão (com WhatsApp) e do iFood vira ficha aqui. Segmente e chame no WhatsApp com a mensagem pronta.</p>
 <div class="row" style="margin-bottom:14px">${Object.entries({todos:'Todos',vip:'VIP',empresa:'Empresas',sumidos:'Sumidos 15+ dias',novos:'Novos',aniver:'Aniversariantes'}).map(([k,n])=>`<button class="ch ${CS===k?'on':''}" onclick="CS='${k}';render()">${n}</button>`).join('')}<input placeholder="Buscar nome ou telefone" value="${CQ}" oninput="CQ=this.value;clearTimeout(window._q);window._q=setTimeout(render,300)" style="margin-left:auto"></div>
 <div class="box"><table><tr><th>Cliente</th><th class="hide-m">Bairro</th><th>Pedidos</th><th>Gasto</th><th class="hide-m">Último</th><th></th></tr>${L.map(c=>`<tr><td><b>${c.nome}</b>${c.tags.map(t=>` <span class="tag" style="background:var(--ouro)">${t}</span>`).join('')}<br><small style="color:var(--cinza)">${tf(c.tel)}${c.obs?' · '+c.obs:''}${c.aniversario?' · aniv. '+c.aniversario:''}</small></td><td class="hide-m">${c.bairro}</td><td>${c.pedidos}</td><td>${brl(c.gasto)}</td><td class="hide-m ${dias(c.ultimo)>=15?'al':''}">${c.ultimo?dias(c.ultimo)+' dias':'—'}</td><td><a class="b sm" style="text-decoration:none" target="_blank" href="https://wa.me/55${c.tel}?text=${encodeURIComponent(msg(c))}">WhatsApp</a></td></tr>`).join('')||'<tr><td>Nenhum cliente neste filtro.</td></tr>'}</table></div>`}

function vCard(){return `<h1>Cardápio</h1><p class="sub">Mudou o preço aqui, mudou no site na hora. Pause o que acabou.</p><div class="box"><table><tr><th>Produto</th><th class="hide-m">Categoria</th><th>Preço</th><th class="hide-m">Ficha técnica</th></tr>${D.produtos.map(p=>`<tr><td>${p.nome}</td><td class="hide-m">${p.cat}</td><td><input value="${p.preco}" style="width:90px" onchange="D.produtos.find(x=>x.id==='${p.id}').preco=+this.value.replace(',','.');VJ.save(D);toast('Preço atualizado no site')"></td><td class="hide-m" style="font-size:13px;color:var(--cinza)">${Object.entries(p.ficha).map(([k,v])=>v+' '+(D.estoque.find(e=>e.id===k)||{}).un+' '+((D.estoque.find(e=>e.id===k)||{}).nome||k)).join(' · ')||'—'}</td></tr>`).join('')}</table></div>`}

VJ.on(d=>{d.pedidos.forEach(p=>{if(!visto.has(p.id)){visto.add(p.id);if(p.status==='novo'){novos.add(p.id);toast('Novo pedido #'+p.num+' pelo '+d.canais[p.canal])}}});if(!document.querySelector('.md.on'))render()});
render();
</script>
</body>
</html>
